name: spike-reachability

# Milestone 0. Answers what a developer machine cannot:
#   1. Do the data sources answer an Azure (GitHub-hosted) runner?
#   2. Does PSN throttle a sustained run, and on what axis?
#
# Every probe is non-fatal so one dead source cannot mask the others; the
# summary step is what fails the run.
#
#   gh workflow run spike.yml && gh run watch

on:
  workflow_dispatch:
    inputs:
      canary_requests:
        description: "Requests for the sustained-rate canary"
        required: false
        default: "120"

permissions:
  contents: read

env:
  UA: "new-game-plus/0.1 (+https://github.com/mheidari98/new-game-plus)"
  GRID: 'https://web.np.playstation.com/api/graphql/v1/op?operationName=categoryGridRetrieve&variables=%7B%22id%22%3A%223f772501-f6f8-49b7-abac-874a88ca4897%22%2C%22pageArgs%22%3A%7B%22size%22%3A1%2C%22offset%22%3A0%7D%2C%22sortBy%22%3Anull%2C%22filterBy%22%3A%5B%5D%2C%22facetOptions%22%3A%5B%5D%7D&extensions=%7B%22persistedQuery%22%3A%7B%22version%22%3A1%2C%22sha256Hash%22%3A%224e41660b6732f35c99fc5541926b7502a09557924e8c2cfebd1beb1a5c8c8f81%22%7D%7D'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Egress IP and geo
        run: |
          IP=$(curl -s --max-time 15 https://api.ipify.org)
          echo "egress ip: $IP"
          curl -s --max-time 15 "https://ipinfo.io/${IP}/json" | grep -E '"(city|region|country|org)"' || true

      - name: PSN GraphQL
        run: |
          code=$(curl -s -o /tmp/psn.json -w '%{http_code}' --max-time 30 \
            -H 'content-type: application/json' -H 'x-psn-store-locale-override: en-US' \
            -A "$UA" "$GRID")
          echo "psn=$code" | tee -a /tmp/summary
          python3 -c "
          import json
          d=json.load(open('/tmp/psn.json'))
          g=d['data']['categoryGridRetrieve']
          print('  totalCount:',g['pageInfo']['totalCount'])
          print('  price:',g['products'][0]['price']['basePrice'])
          " || echo "  (unparseable)"

      # The PS+ feed 404'd from a US runner while working from EU and IR, so
      # this walks the variants instead of assuming one URL.
      - name: PS Plus feed - diagnose regional routing
        continue-on-error: true
        run: |
          probe () {
            code=$(curl -s -o /tmp/p.json -w '%{http_code}' --max-time 25 -A "$UA" "$2")
            n=$(python3 -c "
          import json
          try:
              d=json.load(open('/tmp/p.json'))
              print(sum(len(b.get('games',[])) for b in d) if isinstance(d,list) else 'not-a-list')
          except Exception: print('-')
          " 2>/dev/null)
            echo "  $1 -> $code (entries: $n)"
          }
          probe "plain            " 'https://www.playstation.com/bin/imagic/gameslist?locale=en-us&categoryList=plus-games-list'
          probe "follow redirects " '-L https://www.playstation.com/bin/imagic/gameslist?locale=en-us&categoryList=plus-games-list'
          probe "en-us slash      " 'https://www.playstation.com/en-us/bin/imagic/gameslist?locale=en-us&categoryList=plus-games-list'
          probe "monthly list     " 'https://www.playstation.com/bin/imagic/gameslist?locale=en-us&categoryList=plus-monthly-games-list'
          probe "no locale        " 'https://www.playstation.com/bin/imagic/gameslist?categoryList=plus-games-list'
          echo "--- headers on the failing URL ---"
          curl -s -D - -o /dev/null --max-time 25 -A "$UA" \
            'https://www.playstation.com/bin/imagic/gameslist?locale=en-us&categoryList=plus-games-list' \
            | grep -iE '^(HTTP|location|server|x-dispatcher|akamai|x-cache|content-type)' || true
          echo "--- does the PS+ page itself load, and what feed does it name? ---"
          curl -s -L --max-time 25 -A "$UA" 'https://www.playstation.com/en-us/ps-plus/games/' -o /tmp/pp.html
          echo "  page bytes: $(wc -c </tmp/pp.html)"
          grep -oE '(bin/imagic/[a-zA-Z]+|/[a-z-]*gameslist[a-z-]*)' /tmp/pp.html | sort -u | head
          grep -oE 'categoryList=[a-z-]+' /tmp/pp.html | sort -u | head

      - name: Metacritic backend
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -A "$UA" \
            'https://backend.metacritic.com/finder/metacritic/search/celeste/web?apiKey=1MOZgmNFxvmljaQR1X9KAij9Mo4xAY3u&limit=1&mcoTypeId=13&offset=0')
          echo "metacritic=$code" | tee -a /tmp/summary

      - name: HowLongToBeat
        continue-on-error: true
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36' \
            https://howlongtobeat.com/)
          echo "hltb=$code" | tee -a /tmp/summary

      - name: IGDB and Twitch
        continue-on-error: true
        run: |
          echo "igdb=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://api.igdb.com/v4/games)" | tee -a /tmp/summary
          echo "twitch=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://id.twitch.tv/oauth2/token)" | tee -a /tmp/summary

      - name: Sustained-rate canary
        continue-on-error: true
        run: |
          N='${{ github.event.inputs.canary_requests || 120 }}'
          fail=0; first=''
          start=$SECONDS
          for i in $(seq 1 "$N"); do
            u=$(echo "$GRID" | sed "s/%22offset%22%3A0/%22offset%22%3A$i/")
            c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
              -H 'content-type: application/json' -H 'x-psn-store-locale-override: en-US' \
              -A "$UA" "$u")
            if [ "$c" != "200" ]; then
              fail=$((fail+1))
              [ -z "$first" ] && first="req#$i t=$((SECONDS-start))s http=$c" && echo "  first failure: $first"
            fi
            sleep 1
          done
          echo "canary=${fail}/${N} over $((SECONDS-start))s" | tee -a /tmp/summary

      - name: Summary
        if: always()
        run: |
          echo "=== reachability from $(curl -s --max-time 10 https://api.ipify.org) ==="
          cat /tmp/summary 2>/dev/null || echo "(nothing recorded)"
          # PSN is the only source whose absence makes the project impossible.
          grep -q '^psn=200$' /tmp/summary || { echo "FATAL: PSN unreachable"; exit 1; }
